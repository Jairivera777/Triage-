<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF8">
    <title>triage++</title>
    <style>
        .seccion-panel { display: none; }
        .seccion-panel.activa { display: block; }
        .pestana { cursor: pointer; padding: 10px; display: inline-block; }
        .pestana.activa { font-weight: bold; border-bottom: 2px solid #000; }
        .notificacionExito {
                display: none;
                position: fixed;
                top: 20px;
                right: 20px;
                background-color: #4CAF50;
                color: white;
                padding: 15px 25px;
                border-radius: 8px;
                box-shadow: 0 4px, 8px rgb(0,0,0,0,2);
                z-index: 1000;
                font-family: sans-serif;
        }
    </style>
</head>
<body>
    <header>
        <span>TRIAGE ++</span>
        <span> |</span>
        <span>Jaime Rivera</span>
        <span> |</span>
        <span>Santiago Lopez</span>
        <span> |</span>
        <span>Esteban Miranda</span>
        <span> |</span>
        <span id="Hora">00:00:00</span>
    </header>
    <div id="notificacionExito" class="notificacionExito">
        <strong>¡Exito!</strong> Datos guardados correctamente. Nivel de Triage <span id="nivelTriageExito"></span>
    </div>
    <div class="barra pestanas">  <!--Las 3 pestañas que aparecen salen de aqui-->
        <div class="pestana activa" id="tab-triage" onclick="irA('triage')">Triage</div>
        <div class="pestana" id="tab-consulta" onclick="irA('consulta')">Consulta</div>
        <div class="pestana" id="tab-altas" onclick="irA('altas')">Altas</div>
    </div>
    <div id="pantalla-triage" class="seccion-panel activa">
        <div class="contenedor-paneles">
            <section class="panel-izquierdo">
                <form id="formTriage">
                    <fieldset>
                        <legend>Información del paciente</legend>
                        <div id="antesDocumento">
                            <label for="nombrePaciente">Nombre Paciente:</label>
                            <input type="text" id="nombrePaciente" name="nombrePaciente">
                        </div>
                        <label for="tipoDocumentoPaciente">Tipo de documento:</label>
                        <select id="tipoDocumentoPaciente" name="tipoDocumentoPaciente" required>
                            <option value="" disabled selected>Seleccione una opcion...</option>
                            <option value="CC">CC - Cedula de Ciudadania</option>
                            <option value="TI">TI - Tarjeta de identidad</option>
                            <option value="RC">RC - Registro civil</option>
                            <option value="CN">CN - Certificado de nacido</option>
                            <option value="CE">CE - Cedula de Extranjeria</option>
                            <option value="PA">PA - Pasaporte</option>
                            <option value="PT">PT - Permiso por Protección Temporal (PPT)</option>
                            <option value="PE">PE - Permiso Especial de Permanencia (PEP)</option>
                            <option value="SC">SC - Salvoconducto de permanencia</option>
                            <option value="CD">CD - Carné diplomático</option>
                            <option value="DE">DE - Documento extranjero de identificación</option>
                            <option value="AS">AS - Adulto sin identificar</option>
                            <option value="MS">MS - Menor sin identificar</option>
                            <option value="SI">SI - Sin identificar</option>
                        </select>
                        <label for="Sexo">Sexo:</label>
                        <select name="sexo" id="Sexo" required>
                            <option value="" disabled selected>Seleccione una opcion...</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Femenino">Femenino</option>
                        </select> 
                        <div class="femenino" id="seccion-embarazo" style="display: none;">
                            <span>¿Estas embarazada?:</span>
                            <input type="radio" id="verdadero" name="embarazada" value="true">
                            <label for="verdadero">Si</label>
                            <input type="radio" id="falsa" name="embarazada" value="false">
                            <label for="falsa">No</label>                
                        </div>
                        <div id="despuesDocumento">
                            <label for="Numero">Numero de documento:</label>
                            <input type="text" id="Numero" name="documentoPaciente">
                            <label for="Edad">Edad:</label>
                            <input type="number" id="Edad" name="edad" min="0" max="150">   
                            <label for="eps">EPS: </label>
                            <input type="text" id="eps" name="eps">
                            <label for="correoPaciente">Correo:</label>
                            <input type="text" id="correoPaciente" name="correoPaciente">
                            <label for="telefonoPaciente">Telefono:</label>
                            <input type="text" id="telefonoPaciente" name="telefonoPaciente">
                            <label for="direccion">Direccion de residencia:</label>
                            <input type="text" id="direccion" name="direccion">
                        </div>
                    </fieldset>
                    <br>
                    <div class="datosAcudiente">
                        <fieldset>
                            <legend>Informacion acudiente</legend>
                            <div class="antes-parentesco" id="antes-parentesco">
                                <label for="nombreAcudiente">Nombre acudiente:</label>
                                <input type="text" id="nombreAcudiente" name="nombreAcudiente">
                                <label for="tipoDocumentoAcudiente">Tipo de documento:</label>
                                <select id="tipoDocumentoAcudiente" name="tipoDocumentoAcudiente">
                                    <option value="" disabled selected>Seleccione una opcion...</option>
                                    <option value="CC">CC - Cedula de Ciudadania</option>
                                    <option value="TI">TI - Tarjeta de identidad</option>
                                    <option value="CE">CE - Cedula de Extranjeria</option>
                                    <option valie="PA">PA - Pasaporte</option>
                                    <option value="PT">PT - Permiso por Protección Temporal (PPT)</option>
                                    <option value="PE">PE - Permiso Especial de Permanencia (PEP)</option>
                                    <option value="SC">SC - Salvoconducto de permanencia</option>
                                    <option value="CD">CD - Carné diplomático</option>
                                    <option value="DE">DE - Documento extranjero de identificación</option>
                                </select>
                                <label for="documento">Numero de documento:</label>
                                <input type="text" id="documento" name="documentoAcudiente">
                            </div>
                            <label for="parentesco">Parentesco:</label>
                            <select id="parentesco" name="parentesco">
                                <option value="" disabled selected>Seleccione una opcion...</option>
                                <option value="mama">Madre</option>
                                <option value="papa">Padre</option>
                                <option value="padrastro">Padrastro/Madrastra</option>
                                <option value="abuelo">Abuelo/a paterno/materno</option>
                                <option value="hermano">Hermano/a</option>
                                <option value="tio">Tio/a</option>
                                <option value="tutor">Tutor</option>
                                <option value="defensor">Defensor de familia/Autoridad</option>
                                <option value="instructor">Profesor/Instructor</option>
                                <option value="conocido">Vecino/Conocido/Amigo</option>
                                <option value="nadie">Sin acompañante</option>
                            </select>
                            <div class="despues-parentesco" id="despues-parentesco">
                                <label for="correo">Correo:</label>
                                <input type="text" id="correo" name="correoAcudiente">
                                <label for="telefono">Telefono:</label>
                                <input type="text" id="telefono" name="telefonoAcudiente">
                            </div>
                        </fieldset>
                    </div>
                    <br>
                    <fieldset>
                        <legend>Signos vitales y Sintomas</legend>
                        <label for="temperatura">Temperatura (°C):</label>
                        <input type="number" id="temperatura" name="temperatura">
                        <label for="altura">Estatura (cm):</label>
                        <input type="number" id="altura" name="estatura">
                        <label for="peso">Peso (kg):</label>
                        <input type="number" id="peso" name="peso">
                        <label for="frecuencia">Frecuencia cardiaca:</label>
                        <input type="text" id="frecuencia" name="presionArterial">
                        <label for="presionSistolica">Presion Sistolica:</label>
                        <input type="number" id="presionSistolica" name="frecuenciaSistolica">
                        <label for="presionDiastolica">Presion Diastolica:</label>
                        <input type="number" id="presionDiastolica" name="frecuenciaDiastolica">
                        <label for="frecuenciaRespiratoria">Frecuencia respiratoria por minuto:</label>
                        <input type="number" id="frecuenciaRespiratoria" name="frecuenciaRespiratoria">
                        <label for="saturacion">SpO2%:</label>
                        <input type="number" id="saturacion" name="saturacion" min="0" max="100">
                        <label for="escalaGlasgow">Escala de Glasgow</label>
                        <input type="number" id="escalaGlasgow" name="escalaGlasgow" min="3" max="15">
                        <label for="escala">Escala del dolor:</label>
                        <input type="number" id="escala" name="escala" min="0" max="10">
                        <label for="motivo">Motivo de venir a urgencias: </label>
                        <input type="text" id="motivo" name="motivo">
                        <label for="alergias">Alergias:</label>
                        <input type="text" id="alergias" name="alergias">
                        <label for="enfermedades">Enfermedades:</label>
                        <input type="text" id="enfermedades" name="enfermedades">
                        <label for="cirugias">Cirugias recientes: </label>
                        <input type="text" id="cirugias" name="cirugias">
                        <label for="observaciones">Observaciones:</label>
                        <input type="text" id="observaciones" name="observaciones">
                    </fieldset>
                    <button type="submit" class="boton">Guardar datos y calcular triage</button>
                </form>
            </section>
            <section class="panel-derecho">
                <h2 class="titulo-derecha">FILTRO DE PACIENTES</h2>
                <label for="filtros">FILTROS: </label>
                <select id="filtros" name="filtro">
                    <option value="todos" selected>TODOS</option>
                    <option value="1">TRIAGE 1</option>
                    <option value="2">TRIAGE 2</option>
                    <option value="3">TRIAGE 3</option>
                    <option value="4">TRIAGE 4</option>
                    <option value="5">TRIAGE 5</option>
                </select>
            </section>
        </div>
    </div>
    <div id="pantalla-consulta" class="seccion-panel"><h2>Panel de consultas</h2></div>
    <div id="pantalla-altas" class="seccion-panel"><h2>Panel de altas</h2></div>
    <script>
        function actualizarHora(){ // funcion encargada de actualizar la hora de la interfaz cada segundo
            const ahora = new Date();
            let horas = ahora.getHours().toString().padStart(2, '0');
            let minutos = ahora.getMinutes().toString().padStart(2, '0');
            let segundos = ahora.getSeconds().toString().padStart(2, '0');
            document.getElementById('Hora').textContent = `${horas}:${minutos}:${segundos}`;
        }
        actualizarHora();
        setInterval(actualizarHora, 1000);
        function irA(modulo){ // funcion que se encarga de sobreescribir la pagina segun el click que de el usuario
            document.querySelectorAll('.seccion-panel').forEach(pantalla => {
                pantalla.classList.remove('activa');
            });
            document.querySelectorAll('.pestana').forEach(tab => {
                tab.classList.remove('activa');
            });
            document.getElementById('pantalla-'+modulo).classList.add('activa');
            document.getElementById('tab-'+modulo).classList.add('activa');
        };
        const selectParentesco = document.getElementById('parentesco');
        const bloqueAntes = document.getElementById('antes-parentesco')
        const bloqueDespues = document.getElementById('despues-parentesco');
        selectParentesco.addEventListener('change', function() { //se encarga de que si no tiene parentesco no aparezcan casillas
            if(this.value === 'nadie'){
                bloqueAntes.style.display = 'none';
                bloqueDespues.style.display = 'none';
            }else{
                bloqueAntes.style.display = 'block';
                bloqueDespues.style.display = 'block';
            }
        });
        const selectSexo = document.getElementById('Sexo');
        const seccionEmbarazo = document.getElementById('seccion-embarazo');
        selectSexo.addEventListener('change', function(){ //Si no es mujer no aaprece la funcion de embarazo
            if(this.value === 'Femenino'){
                seccionEmbarazo.style.display = 'block';
            }else{
                seccionEmbarazo.style.display = 'none'
            }
        });
        const selectDocumento = document.getElementById('tipoDocumentoPaciente');
        const antesDocumento = document.getElementById('antesDocumento');
        const despuesDocumento = document.getElementById('despuesDocumento');
        selectDocumento.addEventListener('change', function(){ //Si esta no identifiado no pide los demas datos
            if(this.value === 'AS' || this.value === 'MS' || this.value === 'SI'){
                antesDocumento.style.display = 'none';
                despuesDocumento.style.display = 'none';
            } else{
                antesDocumento.style.display = 'block';
                despuesDocumento.style.display = 'block';
            }
        });
        document.getElementById('formTriage').addEventListener('submit', function(e) { // se encarga de conectar el front con c++
            e.preventDefault();
            const formData = new FormData(document.getElementById('formTriage'));
            const params = new URLSearchParams(formData);

            fetch('http://localhost:8080/api/triage' , {
                method: 'POST',
                body: params
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "ok") {
                    const notif = document.getElementById('notificacionExito');
                    document.getElementById('nivelTriageExito').textContent = data.triage;
                    notif.style.display = 'block';

                    setTimeout(() => {
                        notif.style.display = 'none';
                    }, 4000);
                    document.getElementById('formTriage').reset();
                    document.getElementById('seccion-embarazo').style.display = 'none';
                }
            })
            .catch(error => {
                console.error('Error al conectar con C++: ', error);
                alert("No se logro conectar con C++");
            });
        });
    </script>
</body>
</html>
